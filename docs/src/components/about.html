<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../css/menu.css">
    <link rel="icon" type="image/png" href="../../images/favicon.png" sizes="32x32">
    <title>Team</title>
</head>
<body>
<div class="page-wrapper">
  <div class="background-container"><img src="../../images/m-es.jpg" /></div>
  <nav>
      <ul class="sidebar">
      <li onclick="hideSidebar()"><a href="#"><img src="../../images/close_wb.png"h></img></a></li>
      <li><a href="../components/project.html">Overview</a></li>
      <li><a href="../components/docs.html">Documents</a></li>
      <li><a href="../components/about.html">About Us</a></li>
    </ul>
    <ul>
      <li><a href="../../index.html"><img src="../../images/favicon.png"></img></a></li>
      <li class="hideOnMobile"><a href="../components/project.html">Overview</a></li>
      <li class="hideOnMobile"><a href="../components/docs.html">Documents</a></li>
      <li class="hideOnMobile"><a href="../components/about.html">About Us</a></li>
      <li class="menu-button" onclick="showSidebar()"><a href="#"><img src="../../images/white_dots.png"></img></a></li>
    </ul>
  </nav>
  <div class="hero">
    <h2>Team Members</h2>
      <div class="team-grid" id="teamGrid"></div>
        <div class="large-image-container">
          <img id="largeImage" src="" alt="Large Team Member" class="large-image">
        </div>
  </div>
</div>
  <script>
    function showSidebar(){
      const sidebar = document.querySelector('.sidebar');
      sidebar.style.display = 'flex';
    }
    function hideSidebar(){
      const sidebar = document.querySelector('.sidebar');
      sidebar.style.display = 'none';
    }

    const teamGrid = document.getElementById('teamGrid');
        const largeImage = document.getElementById('largeImage');

        const teamImages = [
            { small: '../../images/code.png', large: '../../images/spain-s.png' },
            { small: '../../images/stats.png', large: '../../images/kr-w.png' },
        ];

        function populateTeamGrid() {
            teamImages.forEach(member => {
                const img = document.createElement('img');
                img.src = member.small;
                img.alt = 'Team Member';
                img.classList.add('team-member');
                img.dataset.large = member.large; 
                img.addEventListener('click', handleMemberClick); 
                teamGrid.appendChild(img);
            });
        }

        // Function to handle clicks on team member images
        function handleMemberClick(event) {
            const largeSrc = event.target.dataset.large; 
            largeImage.src = largeSrc; 
            largeImage.style.display = 'block'; 
        }

        populateTeamGrid();

  </script>
</body>
</html>
